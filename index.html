<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="https://media.pcngon.vn/wp-content/uploads/2022/12/cropped-logo-pcngon-vuong-01.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cửa hàng máy tính Pcngon</title>
  <meta name="description"
    content="Pcngon - Chuyên Mini ITX, Mini PC, PC Gaming, Dock eGPU, NAS, màn hình máy tính chính hãng, giá tốt nhất." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="preconnect" href="https://media.pcngon.vn" />
  <meta name="theme-color" content="#76b900" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pcngon-theme');
        if (t !== 'light' && t !== 'dark') {
          t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
